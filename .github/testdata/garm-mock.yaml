apiVersion: v1
kind: ConfigMap
metadata:
  name: garm-mock
data:
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer


    class Handler(BaseHTTPRequestHandler):
        def respond(self, status, body):
            payload = json.dumps(body).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def do_GET(self):
            if self.path == "/api/v1/controller-info":
                self.respond(200, {
                    "controller_id": "00000000-0000-0000-0000-000000000001",
                    "hostname": "garm-mock",
                    "metadata_url": "http://garm-mock/metadata",
                    "callback_url": "http://garm-mock/callbacks",
                    "webhook_url": "http://garm-mock/webhooks",
                    "controller_webhook_url": "http://garm-mock/webhooks/controller",
                    "minimum_job_age_backoff": 0,
                    "version": "v0.1.5",
                })
                return
            self.respond(200, {})

        def do_POST(self):
            if self.path == "/api/v1/first-run":
                self.respond(409, {})
                return
            if self.path == "/api/v1/auth/login":
                self.respond(200, {
                    "token": "eyJhbGciOiJub25lIn0.eyJleHAiOjQxMDI0NDQ4MDB9.",
                })
                return
            self.respond(200, {})

        def log_message(self, format, *args):
            return


    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garm-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garm-mock
  template:
    metadata:
      labels:
        app: garm-mock
    spec:
      containers:
        - name: garm-mock
          image: python:3.14.0-alpine3.22@sha256:8373231e1e906ddfb457748bfc032c4c06ada8c759b7b62d9c73ec2a3c56e710
          command:
            - python
            - /app/server.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: server
              mountPath: /app
              readOnly: true
      volumes:
        - name: server
          configMap:
            name: garm-mock
---
apiVersion: v1
kind: Service
metadata:
  name: garm-mock
spec:
  selector:
    app: garm-mock
  ports:
    - name: http
      port: 8080
      targetPort: http
