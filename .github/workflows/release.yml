# SPDX-License-Identifier: MIT

name: release

on:
  push:
    # run only against tags
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0

      - name: Login Helm to ghcr.io
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | helm registry login ghcr.io \
            --username "${{ secrets.REGISTRY_USERNAME }}" \
            --password-stdin

      - name: Synopsys Detect
        run: |
          GITHUB_REF="$(echo "$GITHUB_REF_NAME" | tr ':/' '_')"
          BLACKDUCK_SCAN_VERSION_NAME="${GITHUB_REF}_${GITHUB_SHA}"
          export BLACKDUCK_SCAN_VERSION_NAME

          # create the tmp directory as we also do during the release process
          mkdir -p tmp

          ./hack/foss-scan.sh

          mv tmp/Black_Duck_Notices_Report.txt tmp/3RD_PARTY_LICENSES.txt
        env:
          BLACKDUCK_URL: ${{ secrets.BLACKDUCK_URL }}
          BLACKDUCK_PROJECT_NAME: ${{ secrets.BLACKDUCK_PROJECT_NAME }}
          BLACKDUCK_TOKEN: ${{ secrets.BLACKDUCK_TOKEN }}

      - name: SBOM
        run: make sbom

      - name: release
        run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}

      - name: Publish Helm chart to ghcr.io
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm push "tmp/garm-operator-${version}.tgz" \
            oci://ghcr.io/mercedes-benz/garm-operator/charts

      - name: Send http get to doc.crds.dev to index a new version
        run: |
          curl -sL https://doc.crds.dev/github.com/mercedes-benz/garm-operator@${{ github.ref_name }} | grep -A2 'class="container"'
